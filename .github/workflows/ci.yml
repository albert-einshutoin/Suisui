name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    tags:
      - 'v*'
  release:
    types: [published]
  merge_group:
  schedule:
    # 03:17 JST. The off-hour minute avoids the busiest top-of-hour window.
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      full-validation:
        description: Run the complete validation suite
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  # A tag push and the corresponding Release publication are distinct complete
  # verification events. Include the event so one cannot cancel the other.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test_strategy:
    name: SwiftPM macOS (selected or full)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: macos-26
    timeout-minutes: 40
    outputs:
      strategy: ${{ steps.plan_outputs.outputs.strategy }}
      ui_runtime: ${{ steps.plan_outputs.outputs.ui_runtime }}
      ui_visual_state: ${{ steps.normalize_visual_selection.outputs.state }}
      ui_performance: ${{ steps.plan_outputs.outputs.ui_performance }}
      fallback_reason: ${{ steps.plan_outputs.outputs.fallback_reason }}
    steps:
      - name: Checkout tested revision with full history
        uses: actions/checkout@v4
        with:
          # Merge-base, rename/copy detection, and evidence provenance all need
          # complete history. On pull requests, the default checkout is GitHub's
          # synthesized pull-request merge revision, while HEAD_REVISION below
          # remains the contributor head used only for analysis and provenance.
          fetch-depth: 0

      - name: Restore bounded Swift build cache
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-swift-6-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ hashFiles('ci/config/**', 'ci/impact/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-6-

      - name: Show toolchain
        run: |
          swift --version
          python3 --version
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
          command -v rg

      - name: Decide and execute test strategy
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          SUISUI_MCP_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          SUISUI_CI_TEST_PLAN: ${{ github.workspace }}/.tmp/ci-impact/test-plan.json
          SUISUI_CI_EXECUTION_REPORT: ${{ github.workspace }}/.tmp/ci-impact/execution.json
          SUISUI_CI_IMPACT_ARTIFACT_DIR: ${{ github.workspace }}/.tmp/ci-impact
          SUISUI_SWIFTPM_ARTIFACT_DIR: ${{ github.workspace }}/.tmp/ci-artifacts/swiftpm
        run: |
          ./ci/run-pr-ci.sh \
            --base-revision "origin/$BASE_REF" \
            --head-revision "$HEAD_REVISION"

      - name: Export fail-closed job outputs
        id: plan_outputs
        if: always()
        env:
          PLAN_PATH: ${{ github.workspace }}/.tmp/ci-impact/test-plan.json
        run: |
          if ! python3 ./ci/export-plan.py \
            --plan "$PLAN_PATH" \
            --github-output "$GITHUB_OUTPUT"; then
            {
              echo "strategy=full"
              echo "ui_runtime=true"
              echo "ui_visual=true"
              echo "ui_performance=true"
              echo "fallback_reason=plan exporter failed"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize visual selection
        id: normalize_visual_selection
        if: always()
        env:
          RAW_VISUAL_SELECTION: ${{ steps.plan_outputs.outputs.ui_visual }}
        run: |
          # GitHub expression string comparisons ignore case. Convert the
          # trusted lowercase selector to a numeric state once so the matrix
          # condition and Bash aggregator cannot disagree on FALSE/False.
          case "$RAW_VISUAL_SELECTION" in
            false)
              visual_selection_state=0
              ;;
            true)
              visual_selection_state=1
              ;;
            *)
              visual_selection_state=2
              ;;
          esac
          printf 'state=%s\n' "$visual_selection_state" >> "$GITHUB_OUTPUT"
          printf 'visual_selection_state=%s\n' "$visual_selection_state"

      - name: Upload strategy and execution history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impact-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/ci-impact
            .tmp/ci-artifacts/swiftpm
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  full_validation:
    name: Complete validation
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout tested revision with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore bounded Swift build cache
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-swift-6-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ hashFiles('ci/config/**', 'ci/impact/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-6-

      - name: Show toolchain
        run: |
          swift --version
          python3 --version
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
          command -v rg

      - name: SwiftPM complete suite
        env:
          SUISUI_CI_EXECUTION_REPORT: ${{ github.workspace }}/.tmp/ci-impact/full-execution.json
          SUISUI_CI_IMPACT_ARTIFACT_DIR: ${{ github.workspace }}/.tmp/ci-impact
          SUISUI_SWIFTPM_ARTIFACT_DIR: ${{ github.workspace }}/.tmp/ci-artifacts/swiftpm
        run: ./ci/run-full.sh

      - name: Upload complete SwiftPM test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/ci-impact/full-execution.json
            .tmp/ci-artifacts/swiftpm
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  kokoro-rust-poc:
    name: Kokoro Rust inference PoC
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Restore bounded Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            rust/kokoro-helper/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-kokoro-rust-${{ hashFiles('rust/kokoro-helper/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-kokoro-rust-

      - name: Verify Rust Kokoro boundary
        run: |
          rustc --version
          cargo fmt --manifest-path rust/kokoro-helper/Cargo.toml --check
          cargo test --manifest-path rust/kokoro-helper/Cargo.toml --locked
          cargo clippy --manifest-path rust/kokoro-helper/Cargo.toml --locked -- -D warnings

  ui-runtime:
    name: UI Runtime (production route)
    needs:
      - test_strategy
      - full_validation
    if: ${{ always() && (github.event_name != 'pull_request' || needs.test_strategy.outputs.ui_runtime == 'true') }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Restore Swift build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-swift-6-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ hashFiles('ci/config/**', 'ci/impact/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-6-

      - name: Verify production runtime
        env:
          SUISUI_CI_ARTIFACT_ROOT: ${{ github.workspace }}/.tmp/ci-artifacts
        run: ./scripts/ci.sh ui-runtime

      - name: Upload sanitized runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/ci-artifacts/ui-runtime
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  ui-visual-locales:
    name: UI Visual (live baseline) (${{ matrix.locale }})
    needs:
      - test_strategy
      - full_validation
    # An unavailable or malformed selector result is not permission to skip.
    # Only an explicit false decision may omit the expensive visual matrix.
    if: ${{ always() && (github.event_name != 'pull_request' || needs.test_strategy.outputs.ui_visual_state != '0') }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        locale: [en-US, ja-JP]
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Swift build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-swift-6-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ hashFiles('ci/config/**', 'ci/impact/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-6-

      - name: Capture and compare live UI
        env:
          SUISUI_CI_ARTIFACT_ROOT: ${{ github.workspace }}/.tmp/ci-artifacts
          SUISUI_CI_VISUAL_GATE_LOCALE: ${{ matrix.locale }}
          # Liquid Glass samples the active display environment. Keep hosted
          # evidence pinned to its audited Apple Virtual Display profile.
          SUISUI_CI_VISUAL_BASELINE_PROFILE: apple-virtual-display
          SUISUI_VISUAL_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/ci.sh ui-visual

      - name: Upload audited visual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-${{ matrix.locale }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/ci-artifacts/ui-visual
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  ui-visual:
    # Preserve the established required-check context while the locale matrix
    # provides independent evidence. This aggregator fails unless every
    # required locale completed successfully.
    name: UI Visual (live baseline)
    needs:
      - test_strategy
      - full_validation
      - ui-visual-locales
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate locale visual gates
        env:
          EVENT_NAME: ${{ github.event_name }}
          VISUAL_SELECTION_STATE: ${{ needs.test_strategy.outputs.ui_visual_state }}
          LOCALE_VISUAL_RESULT: ${{ needs.ui-visual-locales.result }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            case "$VISUAL_SELECTION_STATE" in
              1)
                ;;
              0)
                echo "status=not-required"
                exit 0
                ;;
              *)
                echo "failure_category=configuration" >&2
                echo "failure_reason=visual-selection-result-invalid" >&2
                exit 1
                ;;
            esac
          fi
          if [[ "$LOCALE_VISUAL_RESULT" != "success" ]]; then
            echo "failure_category=visual" >&2
            echo "failure_reason=locale-visual-gate-did-not-succeed" >&2
            exit 1
          fi
          echo "status=passed"
          echo "locales=en-US,ja-JP"

  ui-performance-build:
    name: UI Performance Build (release artifact)
    needs:
      - test_strategy
      - full_validation
    if: ${{ always() && (github.event_name != 'pull_request' || needs.test_strategy.outputs.ui_performance == 'true') }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Restore Swift build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-swift-6-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ hashFiles('ci/config/**', 'ci/impact/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-6-

      - name: Build immutable release performance app
        run: |
          set -euo pipefail
          source packaging/app_metadata.env
          artifact_dir=.tmp/ui-performance-app
          archive="$artifact_dir/$APP_NAME.app.tar.gz"
          manifest="$artifact_dir/manifest.env"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"
          SUISUI_RELEASE_BUILD_PURPOSE=performance \
            SUISUI_BUILD_CONFIGURATION=release ./script/build_and_run.sh --build-only
          COPYFILE_DISABLE=1 /usr/bin/tar -czf "$archive" -C dist "$APP_NAME.app"
          archive_sha256="$(shasum -a 256 "$archive" | awk '{print $1}')"
          source_commit="$(git rev-parse HEAD)"
          printf 'format_version=1\nsource_commit=%s\nbuild_configuration=release\narchive_sha256=%s\n' \
            "$source_commit" "$archive_sha256" >"$manifest"

      - name: Upload immutable release performance app
        uses: actions/upload-artifact@v4
        with:
          name: ui-performance-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/ui-performance-app
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  ui-performance:
    name: UI Performance (production route)
    needs:
      - test_strategy
      - full_validation
      # Do not mix release cold-launch evidence with concurrent macOS UI work.
      - ui-runtime
      - ui-visual
      - ui-performance-build
    if: ${{ always() && (github.event_name != 'pull_request' || needs.test_strategy.outputs.ui_performance == 'true') }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Download immutable release performance app
        uses: actions/download-artifact@v4
        with:
          name: ui-performance-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/ui-performance-app

      - name: Measure production runtime
        env:
          SUISUI_CI_ARTIFACT_ROOT: ${{ github.workspace }}/.tmp/ci-artifacts
          SUISUI_PERFORMANCE_PROFILE: release
          SUISUI_PERFORMANCE_BUILD_CONFIGURATION: release
          SUISUI_PERFORMANCE_MAX_COLD_LAUNCH_MS: 1000
          SUISUI_PERFORMANCE_MAX_DESTINATION_SWITCH_MS: 3000
          SUISUI_PERFORMANCE_USE_PREBUILT_APP: 1
          SUISUI_PERFORMANCE_ARTIFACT_DIR: ${{ github.workspace }}/.tmp/ui-performance-app
        run: ./scripts/ci.sh ui-performance

      - name: Upload sanitized performance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/ci-artifacts/ui-performance
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

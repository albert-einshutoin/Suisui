name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  merge_group:
  schedule:
    # 03:17 JST. The off-hour minute avoids the busiest top-of-hour window.
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      full-validation:
        description: Run the complete validation suite
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test_strategy:
    name: SwiftPM macOS (selected or full)
    runs-on: macos-26
    timeout-minutes: 40
    outputs:
      strategy: ${{ steps.plan_outputs.outputs.strategy }}
      shadow_full: ${{ steps.plan_outputs.outputs.shadow_full }}
      ui_runtime: ${{ steps.plan_outputs.outputs.ui_runtime }}
      ui_visual: ${{ steps.plan_outputs.outputs.ui_visual }}
      ui_performance: ${{ steps.plan_outputs.outputs.ui_performance }}
      fallback_reason: ${{ steps.plan_outputs.outputs.fallback_reason }}
    steps:
      - name: Checkout exact source revision with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Merge-base, rename/copy detection, and evidence provenance all need
          # complete history. The analyzer still fails closed if it is missing.
          fetch-depth: 0

      - name: Restore bounded Swift build cache
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-swift-6-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ hashFiles('ci/config/**', 'ci/impact/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-6-

      - name: Show toolchain
        run: |
          swift --version
          python3 --version
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
          command -v rg

      - name: Decide and execute test strategy
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          SUISUI_CI_TEST_PLAN: ${{ github.workspace }}/.tmp/ci-impact/test-plan.json
          SUISUI_CI_EXECUTION_REPORT: ${{ github.workspace }}/.tmp/ci-impact/execution.json
          SUISUI_CI_IMPACT_ARTIFACT_DIR: ${{ github.workspace }}/.tmp/ci-impact
          SUISUI_SWIFTPM_ARTIFACT_DIR: ${{ github.workspace }}/.tmp/ci-artifacts/swiftpm
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            ./ci/run-pr-ci.sh \
              --base-revision "origin/$BASE_REF" \
              --head-revision "$HEAD_REVISION"
          else
            ./ci/run-pr-ci.sh \
              --base-revision "$HEAD_REVISION" \
              --head-revision "$HEAD_REVISION" \
              --force-full-reason "$EVENT_NAME complete validation policy"
          fi

      - name: Export fail-closed job outputs
        id: plan_outputs
        if: always()
        env:
          PLAN_PATH: ${{ github.workspace }}/.tmp/ci-impact/test-plan.json
        run: |
          if ! python3 ./ci/export-plan.py \
            --plan "$PLAN_PATH" \
            --github-output "$GITHUB_OUTPUT"; then
            {
              echo "strategy=full"
              echo "shadow_full=false"
              echo "ui_runtime=true"
              echo "ui_visual=true"
              echo "ui_performance=true"
              echo "fallback_reason=plan exporter failed"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Upload strategy and execution history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impact-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/ci-impact
            .tmp/ci-artifacts/swiftpm
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  shadow_full:
    name: Shadow full SwiftPM (rollout comparison)
    needs: test_strategy
    if: ${{ always() && github.event_name == 'pull_request' && needs.test_strategy.outputs.strategy == 'selective' && needs.test_strategy.outputs.shadow_full == 'true' }}
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Restore Swift build cache without a competing save
        uses: actions/cache/restore@v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-swift-6-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ hashFiles('ci/config/**', 'ci/impact/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-6-

      - name: Show required tools
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
          command -v rg

      - name: SwiftPM complete suite
        env:
          SUISUI_CI_EXECUTION_REPORT: ${{ github.workspace }}/.tmp/ci-impact/full-execution.json
          SUISUI_CI_IMPACT_ARTIFACT_DIR: ${{ github.workspace }}/.tmp/ci-impact
          SUISUI_SWIFTPM_ARTIFACT_DIR: ${{ github.workspace }}/.tmp/ci-artifacts/swiftpm
        run: ./ci/run-full.sh

      - name: Upload complete SwiftPM test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/ci-impact/full-execution.json
            .tmp/ci-artifacts/swiftpm
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  ui-runtime:
    name: UI Runtime (production route)
    needs: test_strategy
    if: ${{ always() && needs.test_strategy.outputs.ui_runtime == 'true' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Restore Swift build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-swift-6-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ hashFiles('ci/config/**', 'ci/impact/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-6-

      - name: Verify production runtime
        env:
          SUISUI_CI_ARTIFACT_ROOT: ${{ github.workspace }}/.tmp/ci-artifacts
        run: ./scripts/ci.sh ui-runtime

      - name: Upload sanitized runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/ci-artifacts/ui-runtime
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  ui-visual:
    name: UI Visual (live baseline)
    needs: test_strategy
    if: ${{ always() && needs.test_strategy.outputs.ui_visual == 'true' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Restore Swift build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-swift-6-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ hashFiles('ci/config/**', 'ci/impact/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-6-

      - name: Capture and compare live UI
        env:
          SUISUI_CI_ARTIFACT_ROOT: ${{ github.workspace }}/.tmp/ci-artifacts
          SUISUI_VISUAL_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/ci.sh ui-visual

      - name: Upload audited visual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/ci-artifacts/ui-visual
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  ui-performance:
    name: UI Performance (production route)
    needs: test_strategy
    if: ${{ always() && needs.test_strategy.outputs.ui_performance == 'true' }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Restore Swift build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-swift-6-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ hashFiles('ci/config/**', 'ci/impact/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-6-

      - name: Measure production runtime
        env:
          SUISUI_CI_ARTIFACT_ROOT: ${{ github.workspace }}/.tmp/ci-artifacts
          SUISUI_PERFORMANCE_PROFILE: release
          SUISUI_PERFORMANCE_BUILD_CONFIGURATION: release
          SUISUI_PERFORMANCE_MAX_COLD_LAUNCH_MS: 1000
          SUISUI_PERFORMANCE_MAX_DESTINATION_SWITCH_MS: 3000
        run: ./scripts/ci.sh ui-performance

      - name: Upload sanitized performance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/ci-artifacts/ui-performance
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  comparison:
    name: Compare selective and full results
    needs:
      - test_strategy
      - shadow_full
    if: ${{ always() && github.event_name == 'pull_request' && needs.test_strategy.outputs.strategy == 'selective' && needs.test_strategy.outputs.shadow_full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout comparison tool
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download selective evidence
        uses: actions/download-artifact@v4
        with:
          name: impact-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/evidence/selective

      - name: Download full evidence
        uses: actions/download-artifact@v4
        with:
          name: shadow-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/evidence/full

      - name: Compare selective and full results
        run: |
          ./ci/compare-runs.py \
            --selective .tmp/evidence/selective/ci-impact/execution.json \
            --full .tmp/evidence/full/ci-impact/full-execution.json \
            --output .tmp/ci-impact/comparison.json

      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impact-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/ci-impact/comparison.json
          if-no-files-found: error
          retention-days: 30
